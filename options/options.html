<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>每日翻译设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <h1>每日翻译设置</h1>
      <p class="intro">选择模型服务商，也可以连接自定义兼容服务。</p>
      <form id="settings-form">
        <label for="provider">服务商</label>
        <select id="provider" name="provider" required></select>

        <div id="api-type-group" hidden>
          <label for="api-type">API 类型</label>
          <select id="api-type" name="api-type">
            <option value="openai-completions">OpenAI Chat Completions</option>
            <option value="openai-responses">OpenAI Responses</option>
            <option value="anthropic-messages">Anthropic Messages</option>
            <option value="google-generative-ai">Google Generative AI</option>
            <option value="mistral-conversations">Mistral Conversations</option>
          </select>
        </div>

        <label for="base-url">Base URL</label>
        <input id="base-url" name="base-url" type="url" placeholder="请输入模型服务地址" required>
        <p class="help">内置地址可以改为代理、内网网关或本地部署地址。</p>

        <label for="token">Token</label>
        <div class="token-row">
          <input id="token" name="token" type="password" autocomplete="off" placeholder="请输入 API Token">
          <button id="toggle-token" type="button" aria-label="显示或隐藏 Token">显示</button>
        </div>

        <label for="model">Model</label>
        <input id="model" name="model" type="text" list="model-list" placeholder="请选择或输入模型名称" required>
        <datalist id="model-list"></datalist>

        <label for="model-parameters">模型参数（JSON，可选）</label>
        <textarea id="model-parameters" name="model-parameters" rows="9" spellcheck="false" placeholder='例如：&#10;{&#10;  "temperature": 0,&#10;  "maxTokens": 2048,&#10;  "thinking": false,&#10;  "effort": "low"&#10;}'></textarea>
        <p class="help">支持 temperature、maxTokens、thinking、effort 和 samplingParams；thinking 开启后按 effort 请求推理，具体能力取决于模型及 API 类型。</p>

        <label class="toggle" for="realtime-output">
          <input id="realtime-output" name="realtime-output" type="checkbox">
          <span>实时显示结果</span>
        </label>
        <p class="help">关闭时等待模型完成后一次显示；底层响应协议由所选服务商适配器处理。</p>

        <button class="save" type="submit">保存设置</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
