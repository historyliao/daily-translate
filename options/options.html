<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>每日翻译设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <h1>每日翻译设置</h1>
      <p class="intro">配置 OpenAI-compatible 翻译服务。</p>
      <form id="settings-form">
        <label for="base-url">Base URL</label>
        <input id="base-url" name="base-url" type="url" placeholder="https://api.openai.com/v1" required>

        <label for="token">Token</label>
        <div class="token-row">
          <input id="token" name="token" type="password" autocomplete="off" placeholder="请输入 API Token">
          <button id="toggle-token" type="button" aria-label="显示或隐藏 Token">显示</button>
        </div>

        <label for="model">Model</label>
        <input id="model" name="model" type="text" placeholder="请输入模型名称" required>

        <label for="model-parameters">模型参数（JSON，可选）</label>
        <textarea id="model-parameters" name="model-parameters" rows="7" spellcheck="false" placeholder='例如：&#10;{&#10;  "temperature": 0,&#10;  "reasoning_effort": "low"&#10;}'></textarea>
        <p class="help">支持模型或服务商提供的 Chat Completions 参数。model、messages、stream、stream_options 和 response_format 由插件管理。</p>

        <label class="toggle" for="stream-enabled">
          <input id="stream-enabled" name="stream-enabled" type="checkbox">
          <span>启用流式响应</span>
        </label>

        <button class="save" type="submit">保存设置</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
